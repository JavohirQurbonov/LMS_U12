# =====================================================================
# nginx/http.conf — 1-BOSQICH: faqat HTTP (80-port).
#
# Qachon ishlatiladi: SSL sertifikat hali olinmagan paytda.
# Qanday yoqiladi:    .env faylida NGINX_CONF=http
#
# Nginx vazifalari:
#   1. Let's Encrypt tekshiruviga javob berish (sertifikat olish uchun)
#   2. /static/ va /media/ fayllarini Django'siz, o'zi tez berish
#   3. Qolgan barcha so'rovlarni Django'ga (Gunicorn) uzatish
#
# Nginx bu yerda "reverse proxy" — foydalanuvchi faqat nginx bilan
# gaplashadi, orqadagi Gunicorn va bazani ko'rmaydi.
#
# Konfigni tekshirish:
#   docker compose exec nginx nginx -t
# =====================================================================

server {
    # 80-portni tinglash (HTTP)
    listen 80;

    # "_" — istalgan domen yoki IP bilan kelgan so'rovni qabul qilish.
    # Qaysi domenga ruxsat borligini Django'ning ALLOWED_HOSTS hal qiladi.
    server_name _;

    # Javob sarlavhalarida nginx versiyasini ko'rsatmaslik
    server_tokens off;

    # Yuklanadigan faylning eng katta hajmi.
    # Dars videolari yuklanadi, shuning uchun 200 MB.
    # Bundan katta fayl kelsa, nginx "413 Request Entity Too Large" qaytaradi.
    client_max_body_size 200M;

    # Let's Encrypt domen sizniki ekanini shu manzil orqali tekshiradi:
    # certbot /var/www/certbot ichiga maxsus fayl yozadi, Let's Encrypt
    # esa uni internet orqali http://domen/.well-known/acme-challenge/...
    # manzilidan o'qib ko'radi.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static fayllar (CSS, JS). collectstatic ularni static_data volume'iga
    # yig'adi, nginx esa Django'ga murojaat qilmasdan o'zi beradi.
    # alias — URL'dagi /static/ qismi shu papka bilan almashtiriladi.
    #
    # Cache-Control "no-cache" — brauzer faylni keshda saqlaydi, lekin har
    # safar serverdan "o'zgardimi?" deb so'raydi. O'zgarmagan bo'lsa, nginx
    # faylni qayta yubormaydi, qisqa "304 Not Modified" javob beradi.
    # Sababi: fayl nomlarida versiya yo'q (style.css). Uzoq kesh (masalan
    # 30 kun) qo'yilsa, CSS o'zgartirilib deploy qilingandan keyin ham
    # brauzerlar eski faylni ko'rsataveradi.
    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Foydalanuvchilar yuklagan fayllar (videolar, rasmlar, taqdimotlar).
    # DEBUG=False bo'lganda Django ularni bermaydi — bu nginx'ning ishi.
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Qolgan hamma so'rovlar Django'ga uzatiladi.
    location / {
        # 127.0.0.11 — Docker'ning ichki DNS serveri. U "web" kabi servis
        # nomlarini konteyner IP manziliga aylantiradi. valid=10s — javob
        # 10 soniya eslab qolinadi, keyin qayta so'raladi.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Manzil o'zgaruvchiga yoziladi. Shunda nginx "web" nomini bir marta
        # (ishga tushganda) emas, ishlash davomida qayta-qayta so'raydi.
        # Sababi: web konteyneri qayta yaratilsa, unga yangi IP berilishi
        # mumkin. Eski IP'ni eslab qolgan nginx "502 Bad Gateway" qaytaradi.
        # "web" — compose.yaml dagi servis nomi, 8000 — Gunicorn porti.
        set $django http://web:8000;
        proxy_pass $django;

        # Brauzer yozgan domen Django'ga yetib borsin.
        # Django ALLOWED_HOSTS tekshiruvida shu qiymatdan foydalanadi.
        proxy_set_header Host $host;

        # Foydalanuvchining haqiqiy IP manzilini sarlavhada uzatish.
        # Django'da request.META['REMOTE_ADDR'] baribir nginx konteynerining
        # IP'si bo'lib qoladi. Haqiqiy IP faqat shu sarlavhalar orqali keladi:
        # request.META['HTTP_X_REAL_IP'] va request.META['HTTP_X_FORWARDED_FOR'].
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # So'rov http yoki https orqali kelganini Django'ga bildirish.
        # settings.py dagi SECURE_PROXY_SSL_HEADER aynan shu sarlavhani o'qiydi.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Django javobini 120 soniyagacha kutish (Gunicorn --timeout bilan bir xil)
        proxy_read_timeout 120s;

        # Django yuborgan redirect manzillarini o'zgartirmasdan uzatish
        proxy_redirect off;
    }
}
