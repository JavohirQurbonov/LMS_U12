# =====================================================================
# nginx/https.conf — 2-BOSQICH: HTTPS (443-port).
#
# Qachon ishlatiladi: certbot SSL sertifikatni olib bo'lgandan keyin.
# Qanday yoqiladi:    .env faylida NGINX_CONF=https
#
# DIQQAT: sertifikat hali olinmagan bo'lsa, nginx bu konfig bilan
# ishga TUSHMAYDI ("cannot load certificate" xatosi). Shuning uchun
# avval http.conf bilan ishga tushirib, sertifikat olinadi.
#
# Bu faylda ikkita "server" bloki bor:
#   1. 80-port  — hamma so'rovni HTTPS'ga yo'naltiradi
#   2. 443-port — asosiy sayt, shifrlangan ulanish
# =====================================================================


# ---------------------------------------------------------------------
# 1. 80-port: HTTP'dan HTTPS'ga yo'naltirish
# ---------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Let's Encrypt sertifikati cheklangan muddat amal qiladi. Kunlik cron'dagi
    # "certbot renew" muddat tugashiga oz qolganda uni yangilaydi va tekshiruv
    # yana shu manzil orqali o'tadi. Shuning uchun bu joy redirect qilinmaydi.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Qolgan barcha HTTP so'rovlar xuddi shu manzilning HTTPS
    # varianti tomon doimiy (301) yo'naltiriladi.
    # $host        — so'ralgan domen
    # $request_uri — domendan keyingi qism (/accounts/login/?next=...)
    location / {
        return 301 https://$host$request_uri;
    }
}


# ---------------------------------------------------------------------
# 2. 443-port: asosiy sayt (HTTPS)
# ---------------------------------------------------------------------
server {
    # "ssl" — bu portdagi ulanishlar shifrlanadi
    listen 443 ssl;

    # HTTP/2 — bitta ulanish orqali bir nechta faylni parallel yuklash
    http2 on;

    server_name _;
    server_tokens off;

    # certbot "--cert-name lms" parametri bilan olgan sertifikat fayllari:
    #   fullchain.pem — sertifikat (brauzerga yuboriladi)
    #   privkey.pem   — maxfiy kalit (serverdan hech qachon chiqmaydi)
    # Yo'lda domen nomi yo'q ("lms"), shuning uchun boshqa domenda
    # ishlatganda ham bu faylni tahrirlash shart emas.
    ssl_certificate /etc/letsencrypt/live/lms/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms/privkey.pem;

    # Qolgan qismi http.conf bilan bir xil, izohlari o'sha faylda.

    client_max_body_size 200M;

    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $django http://web:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Bu yerda $scheme = "https". Django shu sarlavhani ko'rib so'rov
        # xavfsiz ekanini biladi va uni qayta-qayta HTTPS'ga yo'naltirmaydi.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
